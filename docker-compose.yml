services:
  mysql:
    image: mysql:8.0
    container_name: sdp2-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Local_SDP2
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - sdp2_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./2025-nodejs-gent13
      dockerfile: Dockerfile
    container_name: sdp2-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 9000
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: Local_SDP2
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
      DATABASE_URL: mysql://root:root@mysql:3306/Local_SDP2
      JWTSECRET: 0e730e67e52ea6c9f1cad5d93722b448
    ports:
      - "9000:9000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./2025-react-gent13
      dockerfile: Dockerfile
    container_name: sdp2-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:9000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  sdp2_mysql_data:
